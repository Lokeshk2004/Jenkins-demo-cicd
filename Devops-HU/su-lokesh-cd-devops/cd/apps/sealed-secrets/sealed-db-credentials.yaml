# Sealed Secret placeholders for database credentials
# These must be generated using kubeseal on the bastion host:
#   kubeseal --controller-name=sealed-secrets-controller \
#            --controller-namespace=sealed-secrets \
#            --format yaml < secret.yaml > sealed-secret.yaml
#
# Example raw secret (DO NOT commit this — only the sealed version):
#   apiVersion: v1
#   kind: Secret
#   metadata:
#     name: users-db-credentials
#     namespace: backend-users
#   stringData:
#     password: <your-password>
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: users-db-credentials
  namespace: backend-users
spec:
  encryptedData:
    password: "<REPLACE_WITH_KUBESEAL_ENCRYPTED_VALUE>"
  template:
    metadata:
      name: users-db-credentials
      namespace: backend-users
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: products-db-credentials
  namespace: backend-products
spec:
  encryptedData:
    password: "<REPLACE_WITH_KUBESEAL_ENCRYPTED_VALUE>"
  template:
    metadata:
      name: products-db-credentials
      namespace: backend-products
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
