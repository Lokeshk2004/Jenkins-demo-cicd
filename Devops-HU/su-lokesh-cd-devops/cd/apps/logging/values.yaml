# -----------------------------------------------
# Loki — Log Aggregation
# -----------------------------------------------
loki:
  fullnameOverride: loki
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
  singleBinary:
    replicas: 1
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "250m"
        memory: "512Mi"
    persistence:
      enabled: true
      size: 10Gi
      storageClassName: gp2

  gateway:
    enabled: false

  # Disable unused components
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

# -----------------------------------------------
# Promtail — Log Shipping Agent
# -----------------------------------------------
promtail:
  fullnameOverride: promtail
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"

  config:
    clients:
      - url: http://loki.logging:3100/loki/api/v1/push

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: drop
            regex: "false"
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
        pipeline_stages:
          - json:
              expressions:
                trace_id: trace_id
                level: level
                service: service
          - labels:
              trace_id:
              level:
              service:
